name: CozyUni CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate canonical game data
        run: python tools/validate_game_data.py

      - name: Validate commerce data
        run: python tools/validate_commerce_data.py

      - name: Validate cosmetic catalog data
        run: python tools/validate_catalog_data.py

      - name: Validate Godot runtime data mirrors
        run: python tools/validate_runtime_data_sync.py

  godot-smoke:
    runs-on: ubuntu-latest
    needs: validate
    env:
      GODOT_VERSION: 4.7.2
      GODOT_BIN: ${{ github.workspace }}/.ci-godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download locked Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-godot
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output .ci-godot/godot.zip
          unzip -q .ci-godot/godot.zip -d .ci-godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path . --import

      - name: Run shell route smoke test
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path . --script res://tests/shell/shell_flow_smoke.gd

      - name: Run Cozy Ludo deterministic rule acceptance
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path . --script res://tests/ludo/ludo_rules_smoke.gd

      - name: Boot main scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path . --quit-after 3
